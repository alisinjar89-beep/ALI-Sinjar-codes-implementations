version: "3.1"
rules:
- rule: greet user
  steps:
    - intent: greet
    - action: utter_greet

- rule: store manual origin
  steps:
    - intent: inform_origin
    - action: utter_origin_received

- rule: acknowledge consented browser location
  steps:
    - intent: inform_location
    - action: utter_location_received

- rule: start trip planning form
  steps:
    - intent: plan_trip
    - action: trip_form
    - active_loop: trip_form

- rule: submit trip form
  condition:
    - active_loop: trip_form
  steps:
    - action: trip_form
    - active_loop: null
    - action: action_search_travel_options
    - action: utter_ask_more

- rule: carbon estimate
  steps:
    - intent: ask_carbon
    - action: action_calculate_carbon

- rule: hotel request
  steps:
    - intent: ask_hotels
    - action: action_search_travel_options

- rule: transport request
  steps:
    - intent: ask_transport
    - action: action_search_travel_options

- rule: activities request
  steps:
    - intent: ask_activities
    - action: action_search_travel_options

- rule: human advisor request
  steps:
    - intent: request_handover
    - action: action_human_handover

- rule: explicit nlu fallback
  steps:
    - intent: nlu_fallback
    - action: action_default_fallback

- rule: out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye
